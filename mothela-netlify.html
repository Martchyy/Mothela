<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>MOTHELA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC400;--k:#0a0a0a;--w:#fff;--g:#6b6b6b;--l:#f1f1f1;--r:8px;--hf:'Barlow Condensed','Arial Narrow',Impact,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#d9d9d9}
body{font-family:Inter,system-ui,sans-serif;color:var(--k);-webkit-tap-highlight-color:transparent}
#app{max-width:430px;height:100%;margin:auto;background:var(--w);display:flex;flex-direction:column;position:relative;overflow:hidden}
.dk{background:var(--k);color:var(--w)}
.sc{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h1,h2,.hf{font-family:var(--hf);font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:.3px}
h1{font-size:44px}h2{font-size:28px}.sm{font-size:13px;color:var(--g)}.dk .sm{color:#aaa}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:54px;background:var(--y);color:var(--k);border:2px solid var(--k);border-radius:var(--r);box-shadow:3px 3px 0 var(--k);font:800 20px var(--hf);text-transform:uppercase;cursor:pointer;padding:0 14px}
.btn.k{background:var(--k);color:var(--y);box-shadow:3px 3px 0 var(--y);border-color:var(--y)}.btn.w{background:#fff}.btn.s{min-height:42px;font-size:16px;width:auto}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--k)}
.card{border:2px solid var(--k);border-radius:var(--r);padding:12px;background:#fff;display:flex;gap:10px;align-items:center;box-shadow:3px 3px 0 var(--k);color:var(--k)}
.card.y{background:var(--y)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.col{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font:800 22px var(--hf);text-transform:uppercase}
.ib{width:42px;height:42px;border:2px solid var(--k);background:#fff;border-radius:var(--r);display:grid;place-items:center;cursor:pointer;color:var(--k)}
.ic{width:28px;height:28px;object-fit:contain}.nav{display:flex;border-top:2px solid var(--k);background:#fff}.nav div{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav .on{color:var(--k)}.nav .ic{width:32px;height:32px}.nav .on .ic{transform:scale(1.18)}.nav div:not(.on) .ic{filter:grayscale(1);opacity:.55}.nav div:not(.on){color:var(--g)}
input,select{width:100%;min-height:50px;border:2px solid var(--k);border-radius:var(--r);padding:0 12px;font:600 16px Inter,sans-serif;background:#fff;color:#0a0a0a;-webkit-text-fill-color:#0a0a0a;color-scheme:light}input::placeholder{color:#777;-webkit-text-fill-color:#777}
label{font:800 14px var(--hf);text-transform:uppercase}.dots{display:flex;gap:8px;justify-content:center}.dots i{width:9px;height:9px;border-radius:50%;background:#ccc}.dots i.on{background:var(--y);border:1px solid var(--k)}
.dk .dots i{background:#444}.dk .dots i.on{background:var(--y)}
.sel{width:24px;height:24px;border:2px solid var(--k);border-radius:50%;display:grid;place-items:center}.sel.on::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--y);outline:2px solid var(--k)}
.pill{font:700 12px Inter;padding:3px 8px;border:2px solid var(--k);border-radius:20px;background:var(--l);white-space:nowrap}.pill.y{background:var(--y)}
.c{display:flex;justify-content:center}.logo{filter:invert(1)}.dk .logo,.logo.wh{filter:none}.map{border:2px solid var(--k);border-radius:var(--r);overflow:hidden;position:relative;background:#f4f4f1}.map svg{display:block;width:100%;height:100%}
.steps{display:flex;justify-content:space-between;position:relative;font-size:12px;font-weight:700}.steps div{text-align:center;flex:1}.steps b{display:block;width:16px;height:16px;border:2px solid var(--k);border-radius:50%;margin:0 auto 4px;background:#fff}.steps .on b{background:var(--y)}
.stat{font:800 34px var(--hf)}.sheet{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:9}.sheet>div{background:#fff;width:100%;padding:16px;border-top:2px solid var(--k);display:flex;flex-direction:column;gap:10px}
.dk{background:#000}.wm{width:82%;aspect-ratio:700/81;background:#FFD000;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes ld{0%,100%{background:#444}50%{background:#FFD000}}@keyframes dt{to{width:1.2em}}
.ent>.sc,.ent>.top,.ent>.map{animation:in .3s ease-out}.ld i{animation:ld 1.2s infinite}.ld i:nth-child(2){animation-delay:.2s}.ld i:nth-child(3){animation-delay:.4s}
.radar{position:relative;width:150px;height:150px;display:grid;place-items:center}.radar i{position:absolute;inset:25px;border:3px solid #FFD000;border-radius:50%;animation:pulse 2.4s infinite}.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
.dt::after{content:"...";display:inline-block;overflow:hidden;width:0;vertical-align:bottom;animation:dt 1.2s steps(4) infinite}.pop{animation:pop .5s}.bubs{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:flex-end;animation:bob 3s infinite}
.btn,.card{transition:transform .1s,box-shadow .1s}.card:active{transform:translate(2px,2px)}.av{width:110px;height:110px;border-radius:50%;overflow:hidden;border:3px solid #000;background:var(--y);display:flex;align-items:flex-end;justify-content:center}.av img{width:92%}.nav{padding-bottom:34px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bk{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 16px;background:#000;color:#FFC400;border:2px solid #000;border-radius:10px;font:800 15px var(--hf);letter-spacing:.3px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:transform .1s}.bk:active{transform:scale(.96)}.bk.w{background:#fff;color:#000}
</style></head><body><div id="app"></div>

function tk(i){const k=[...KIT,...(kitW().equip||[]).filter(x=>!KIT.includes(x))][i],e=kitW().equip||[];upd("washers",ME.id,{equip:e.includes(k)?e.filter(x=>x!=k):[...e,k]})}
function addKit(){const i=document.getElementById("kx"),v=i.value.replace(/['"<>]/g,"").trim();if(!v)return;upd("washers",ME.id,{equip:[...(kitW().equip||[]),v]});i.value=""}
V.equip=()=>{const e=kitW().equip||[],all=[...KIT,...e.filter(x=>!KIT.includes(x))];return`${hd("My equipment","wdash")}<div class=sc><div class=sm>Tick everything you bring. Customers see this next to your rating.</div>${all.map((k,i)=>`<div class=card onclick="tk(${i})"><b class=col>${k}</b><div class="sel ${e.includes(k)?"on":""}"></div></div>`).join("")}<div class=row><input id=kx placeholder="Add other equipment"><button class=bk onclick="addKit()" style="min-height:50px">Add</button></div><button class="btn w" onclick="go('settings')">Settings: name, sound, vibration</button><button class=btn onclick="go('wdash')">Done →</button></div>`};
V.location=()=>{const d=S.draft;return`${hd("Your address","service")}<div class=map style="height:110px;margin:0 16px;flex:none">${abStrip()}</div><div class=sc><label>Street address</label><input id=la value="${d.street||""}" placeholder="e.g. 12 Jacaranda Street"><label>Suburb / area</label><input id=lb value="${d.sub||""}" placeholder="e.g. Mooinooi"><label>Notes for the washer</label><input id=lc value="${d.note||""}" placeholder="Gate colour, landmark, water point"><div class="card y"><b>Pay with cash</b> when the wash is done</div><div style="flex:1"></div><button class=btn onclick="saveLoc()">Confirm Address →</button></div>`};
function saveLoc(){const g=x=>document.getElementById(x).value.replace(/["<>]/g,"").trim(),d=S.draft;if(!g("la")||!g("lb"))return alert("Please enter your street and suburb");d.street=g("la");d.sub=g("lb");d.note=g("lc");d.loc=d.street+", "+d.sub;lss("m_addr",JSON.stringify({street:d.street,sub:d.sub,note:d.note,loc:d.loc}));go("confirm")}

function tone(f,t,d,v=.08){const a=ac();if(!a||!SET.s)return;const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.02)}

function setOpt(k){SET[k]=SET[k]?0:1;lss("m_set",JSON.stringify(SET));cue("accept");draw()}
function saveMe(){const g=x=>document.getElementById(x).value.replace(/["<>]/g,"").trim(),n=g("sn"),p=g("sp");if(!n||!p)return alert("Enter name and phone");ME.name=n;ME.phone=p;lss("m_me",JSON.stringify(ME));sb.from("profiles").upsert({id:AUID,role:ME.role=="w"?"w":"c",name:n,phone:p});if(ME.role=="w")upd("washers",ME.id,{name:n,phone:p});go(ME.role=="w"?"wdash":"profile")}
V.settings=()=>`${hd("Settings",ME.role=="w"?"equip":"profile")}<div class=sc><label>Name</label><input id=sn value="${ME.name}"><label>Phone</label><input id=sp value="${ME.phone||""}"><button class=bk style="width:100%;min-height:52px" onclick="saveMe()">Save details</button><div class=card onclick="setOpt('s')"><b class=col>Sound effects</b><div class="sel ${SET.s?"on":""}"></div></div><div class=card onclick="setOpt('v')"><b class=col>Vibration</b><div class="sel ${SET.v?"on":""}"></div></div></div>`;
V.notifs=()=>{const L=myB().map(b=>[b.created,b.svcName+": "+ST[b.status],b.loc]);if(ME.role=="w")D.bookings.filter(b=>b.status=="pending").forEach(b=>L.push([b.created,"New request: "+b.svcName,b.loc]));return`${hd("Notifications",ME.role=="w"?"wdash":"home")}<div class=sc>${L.sort((a,b)=>b[0]-a[0]).map(n=>`<div class=card><div class=col><b>${n[1]}</b><div class=sm>${n[2]} · ${new Date(n[0]).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</div></div></div>`).join("")||'<div class=sm>Nothing yet. Updates about your washes show here.</div>'}</div>`};
const FAQ=[["How do I pay?","Cash only. Pay your washer when the wash is done."],["Can I cancel?","Yes, while your request is still waiting for a washer. Tap Cancel request on the waiting screen."],["My washer is late","Open your booking and tap the chat icon to message your washer, or call them."],["What do washers bring?","Each washer lists their equipment. You see it on your tracking screen."]];
V.help=()=>`${hd("Help & Support","profile")}<div class=sc>${FAQ.map(f=>`<div class=card style="flex-direction:column;align-items:stretch;gap:4px"><b>${f[0]}</b><div style="font-size:14px">${f[1]}</div></div>`).join("")}</div>`;
V.about=()=>`${hd("About Mothela","profile")}<div class=sc><div class=c><img class=logo src="${WORD}" style="width:70%"></div><div class=card>Mothela is a neighbourhood car wash you book from your phone. Pick a service, enter your address, and a nearby washer comes to you. You pay cash when the wash is done.</div><div class=sm style="text-align:center">Neighbourhood test version</div></div>`;
V.offers=()=>`${hd("Offers","home")}<div class=sc><div class="card y"><div class=col><b class=hf style="font-size:26px">No offers right now</b><div style="font-size:14px">Special offers will show up here. Check back soon.</div></div>${ic("gift")}</div><button class=btn onclick="go('service')">Book a Wash →</button></div>`;
V.profile=()=>`${hd("Profile","home",`<div class=ib onclick="go('settings')">${ic("gear")}</div>`)}<div class=sc><div class=c style="flex-direction:column;align-items:center;gap:6px"><div class=av><img src="${IM.a09}"></div><h2>${ME.name}</h2><div class=sm>${ME.phone}</div></div>${[["cal","My Bookings","bookings"],["bell","Notifications","notifs"],["help","Help & Support","help"],["info","About Mothela","about"]].map(([i,t,g])=>`<div class=card onclick="go('${g}')">${ic(i)}<b class=col>${t}</b>→</div>`).join("")}<button class="btn w" onclick="out()">Log out</button></div>${nav()}`;
function rebook(n){const s=svcs().find(x=>x.name==n);if(s)S.draft.svc=s.id;go("service")}
function signup(r){const n=f1.value.trim(),p=f2.value.trim();if(!n||!p)return alert("Please enter name and phone");ME={id:AUID,role:r,name:n,phone:p};sb.from("profiles").upsert({id:AUID,role:r=="w"?"w":"c",name:n,phone:p}).then(x=>x.error&&console.error(x.error.message));lss("m_me",JSON.stringify(ME));if(r=="w")put("washers",{id:ME.id,name:n,phone:p,online:true,rating:"4.9"});go(r=="w"?"wdash":"home")}
async function out(){ME=null;lss("m_me","null");await sb.auth.signOut();const r=await sb.auth.signInAnonymously();if(r.data&&r.data.session)AUID=r.data.session.user.id;TABLES.forEach(load);go("onboard")}
function nowTxt(){const d=new Date(Date.now()+15*6e4);return"Today, "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function book(){const s=svcs().find(x=>x.id==S.draft.svc),b={id:uid(),cust:ME.id,custName:ME.name,phone:ME.phone,svcName:s.name,price:s.price,loc:S.draft.loc,note:S.draft.note||"",time:nowTxt(),status:"pending",paymentMethod:"cash",created:Date.now()};put("bookings",b);go("done")}
function setPrice(i,v){const l=svcs().map(x=>({...x}));l[i].price=+v;put("config",{id:"services",list:l})}
function adAssign(id,w){if(!w)return;const x=D.washers.find(y=>y.id==w);upd("bookings",id,{status:"assigned",washer:w,washerName:x.name})}
function geo(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{S.draft.loc=`Near ${p.coords.latitude.toFixed(3)}, ${p.coords.longitude.toFixed(3)}`;draw()},()=>alert("Location off. Tap Change and type your address."))}
function sheet(t,m){const e=document.createElement("div");e.className="sheet";e.onclick=()=>e.remove();e.innerHTML=`<div><h2>${t}</h2><div>${m}</div><button class=btn>Close</button></div>`;app.append(e)}
function go(s){S.anim=1;S.scr=s;draw()}
function draw(){if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)&&["admin"].includes(S.scr))return;const f=document.activeElement?.tagName=="INPUT"&&["location","chat","equip","track","settings"].includes(S.scr);if(f){if(S.scr=="chat")fillMsgs();return}let s=S.scr;if(ME&&["splash","onboard"].includes(s)&&S.booted)s=ME.role=="w"?"wdash":ME.role=="a"?"admin":"home";S.scr=s;app.className=(["splash","done"].includes(s)?"dk":"")+(S.anim?" ent":"");S.anim=0;document.documentElement.style.background=document.body.style.background=["splash","done"].includes(s)?"#000":"";app.innerHTML=V[s]();moveCar();fillMsgs()}
setInterval(()=>{if(S.scr=="track")moveCar();if(S.scr=="track"&&S.tb&&S.tb.status=="onway")draw()},4000);
(async()=>{draw();await initSB();TABLES.forEach(watch);setTimeout(()=>{S.booted=1;S.scr=ME?(ME.role=="w"?"wdash":ME.role=="a"?"admin":"home"):"onboard";draw()},1800)})();
</script></body></html>
